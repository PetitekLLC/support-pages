<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>ChatrBox Support Answer</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <style>
        :root {
            --chatrbox-teal: #2bb2cd;
        }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #fafbfc;
            margin: 0;
            padding: 0;
            color: #181e22;
        }
        .header {
            width: 100%;
            background: var(--chatrbox-teal);
            color: #fff;
            position: relative;
            min-height: 120px;
            box-sizing: border-box;
            border-radius: 0px 0px 0 0;
            padding-top: 0;
            padding-bottom: 32px;
        }
        .back-arrow-btn {
            background: none;
            border: none;
            cursor: pointer;
            outline: none;
            padding: 0;
            display: flex;
            align-items: center;
            position: absolute;
            top: 28px;
            left: 24px;
        }
        .back-arrow-btn svg {
            width: 20px;
            height: 20px;
            stroke: #fff;
            display: block;
        }
        .header-logo {
            position: absolute;
            right: 34px;
            height: 48px;
            width: auto;
        }
        .meta-block {
            position: absolute;
            left: 24px;
            top: 64px;
            color: #fff;
            font-size: .91em;
            font-weight: 400;
            letter-spacing: 0.01em;
            line-height: 1.0;
            text-align: left;
        }
        .meta-label {
            font-weight: 600;
            margin-right: 7px;
            opacity: 0.95;
        }
        .main-content {
            margin-top: 28px;
            margin-bottom: 44px;
            padding: 0 20px;
        }
        h1.question, h2.question {
            color: var(--chatrbox-teal);
            font-size: 1.32rem;
            font-weight: 700;
            margin: 0 0 1.08em 0;
            line-height: 1.18;
            word-break: break-word;
            text-align: left;
        }
        .answer-card {
            background: #fff;
            border: 1.5px solid var(--chatrbox-teal);
            border-radius: 11px;
            margin: 0 0 2.5rem 0;
            padding: 1.5rem 1.25rem;
            box-shadow: 0 4px 16px 0 rgba(43,178,205,0.09);
            font-size: 1.13rem;
            line-height: 1.65;
            color: #181e22;
        }
        @media (max-width: 700px) {
            .header {
                min-height: 118px;
                padding-bottom: 6px;
            }
            .back-arrow-btn {
                top: 8px;
                left: 10px;
            }
           .header-logo {
          top: 20px;        /* Logo is 20px from the top of the header */
          right: 20px;      /* Logo is 20px from the right edge of the header */
          height: 40px;     /* Logo's height is 40px (width auto-scales to keep aspect ratio) */
          }

            .meta-block {
                left: 10px;
                top: 36px;
                font-size: 0.93em;
                max-width: 89vw;
                min-width: 60vw;
                word-break: break-all;
                white-space: pre-line;
                line-height: 1.3;
            }
            .main-content {
                margin-top: 10px;
                margin-bottom: 14px;
                padding: 0 7px;
            }
            h1.question, h2.question {
                font-size: 0.98rem;
                margin-top: 0.3em;
                margin-bottom: 0.9em;
                padding-left: 0;
                padding-right: 0;
            }
            .answer-card {
                margin-bottom: 0.7rem;
                padding: 0.8rem 0.5rem;
                font-size: 0.89rem;
                border-radius: 8px;
            }
        }
    </style>
</head>
<body>
<div class="header">
    <button class="back-arrow-btn" onclick="window.history.length > 1 ? window.history.back() : window.location='https://faq.petitek.com';" title="Back">
        <svg viewBox="0 0 28 28" fill="none"><path d="M18 24L10 14L18 4" stroke="white" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <img src="/answers/petitek_logo.png" alt="Petitek Logo" class="header-logo">
    <div class="meta-block">
        <span class="meta-label">Timestamp:</span> 2025-07-20 23:10:28<br>
        <span class="meta-label">ID:</span> 2692b22f-5569-460c-baf4-752b0846fdc7
    </div>
</div>

<div class="main-content">
    <h1 class="question">Q: What is the PETITEK website?</h1>
    <div class="answer-card">The PETITEK website is [www.petitek.com](http://www.petitek.com).</div>
</div>
</body>
</html>
