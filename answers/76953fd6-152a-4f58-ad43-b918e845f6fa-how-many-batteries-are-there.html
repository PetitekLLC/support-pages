<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>ChatrBox Support Answer</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <style>
        :root {
            --chatrbox-teal: #2bb2cd;
        }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #fafbfc;
            margin: 0;
            padding: 0;
            color: #181e22;
        }
        .header {
            width: 100%;
            background: var(--chatrbox-teal);
            color: #fff;
            position: relative;
            min-height: 120px;
            box-sizing: border-box;
            border-radius: 7px 7px 0 0;
            padding-top: 0;
            padding-bottom: 32px;   /* Add more bottom padding */
        }
        .back-arrow-btn {
            background: none;
            border: none;
            cursor: pointer;
            outline: none;
            padding: 0;
            display: flex;
            align-items: center;
            position: absolute;
            top: 28px;
            left: 24px;
        }
        .back-arrow-btn svg {
            width: 24px;
            height: 24px;
            stroke: #fff;
            display: block;
        }
        .header-logo {
            position: absolute;
            top: 28px;
            right: 34px;
            height: 34px;
            width: auto;
        }
        .meta-block {
            position: absolute;
            left: 24px;
            top: 64px; /* 10px below the back arrow */
            color: #fff;
            font-size: 1.03em;
            font-weight: 400;
            letter-spacing: 0.01em;
            line-height: 1.55;
            text-align: left;
        }
        .meta-label {
            font-weight: 600;
            margin-right: 7px;
            opacity: 0.95;
        }
        .main-content {
            margin-top: 28px;
            margin-bottom: 44px;
            padding: 0 20px;
        }
        h1.question, h2.question {
            color: var(--chatrbox-teal);
            font-size: 1.32rem;
            font-weight: 700;
            margin: 0 0 1.08em 0;
            line-height: 1.18;
            word-break: break-word;
            text-align: left;
        }
        .answer-card {
            background: #fff;
            border: 1.5px solid var(--chatrbox-teal);
            border-radius: 11px;
            margin: 0 0 2.5rem 0;
            padding: 1.5rem 1.25rem;
            box-shadow: 0 4px 16px 0 rgba(43,178,205,0.09);
            font-size: 1.13rem;
            line-height: 1.65;
            color: #181e22;
        }
        @media (max-width: 700px) {
            .header {
                min-height: 76px;
            }
            .header-logo {
                height: 24px;
                right: 11px;
                top: 11px;
            }
            .meta-block {
                font-size: 0.93em;
                left: 11px;
                top: 38px;
            }
            .back-arrow-btn {
                top: 8px;
                left: 8px;
            }
            .main-content {
                margin-top: 13px;
                padding: 0 7px;
            }
            h1.question, h2.question {
                font-size: 1.03rem;
            }
            .answer-card {
                margin-bottom: 1.2rem;
                padding: 1rem 0.7rem;
                font-size: 0.97rem;
            }
        }
    </style>
</head>
<body>
<div class="header">
    <button class="back-arrow-btn" onclick="window.history.length > 1 ? window.history.back() : window.location='https://faq.petitek.com';" title="Back">
        <svg viewBox="0 0 28 28" fill="none"><path d="M18 24L10 14L18 4" stroke="white" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <img src="/answers/petitek_logo.png" alt="Petitek Logo" class="header-logo">
    <div class="meta-block">
        <span class="meta-label">Timestamp:</span> 2025-07-20 17:17:42<br>
        <span class="meta-label">ID:</span> 76953fd6-152a-4f58-ad43-b918e845f6fa
    </div>
</div>

<div class="main-content">
    <h1 class="question">Q: How many batteries are there?</h1>
    <div class="answer-card">The ChatrBox uses 4 AAA batteries as its power source.</div>
</div>
</body>
</html>
