<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>ChatrBox Support Answer</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <style>
        :root {
            --chatrbox-teal: #2bb2cd;
        }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #fafbfc;
            margin: 0;
            padding: 0;
            color: #181e22;
        }
        .header {
            width: 100%;
            background: var(--chatrbox-teal);
            color: #fff;
            position: relative;
            min-height: 100px;
            box-sizing: border-box;
            border-radius: 0px 0px 0 0;
            padding-top: 0;
            padding-bottom: 10px;
        }
        .back-arrow-btn {
            background: none;
            border: none;
            cursor: pointer;
            outline: none;
            padding: 0;
            display: flex;
            align-items: center;
            position: absolute;
            top: 10px;
            left: 24px;
        }
        .back-arrow-btn svg {
            width: 20px;
            height: 20px;
            stroke: #fff;
            display: block;
        }
         .header-logo {
          position: absolute;
          right: 34px;
          top: 20px;      /* Add this line for vertical padding */
          height: 48px;
          width: auto;
        }
        
        .meta-block {
            position: absolute;
            left: 24px;
            top: 56px;
            color: #fff;
            font-size: 1.0em;
            font-weight: 300;
            letter-spacing: 0.01em;
            line-height: 1.0;
            text-align: left;
        }
        .meta-label {
            font-weight: 600;
            margin-right: 7px;
            opacity: 0.95;
        }
        .main-content {
            margin-top: 28px;
            margin-bottom: 44px;
            padding: 0 20px;
        }
        h1.question, h2.question {
            color: var(--chatrbox-teal);
            font-size: 1.6rem;
            font-weight: 900;
            margin: 0 0 1.08em 0;
            line-height: 1.18;
            word-break: break-word;
            text-align: left;
        }
        .answer-card {
            background: #fff;
            border: 1.5px solid var(--chatrbox-teal);
            border-radius: 11px;
            margin: 0 0 2.5rem 0;
            padding: 1.5rem 1.25rem;
            box-shadow: 0 4px 16px 0 rgba(43,178,205,0.09);
            font-size: 1.13rem;
            line-height: 1.65;
            color: #181e22;
        }
        @media (max-width: 700px) {
           .header {
        min-height: 0;         /* Let the content dictate the height */
        height: 75px;          /* Try 68px, or adjust lower/higher as needed */
        position: relative;    /* Required for absolute children to use bottom */
        padding-bottom: 0;
          }
            .back-arrow-btn {
                top: 10px;
                left: 10px;
            }
            .header-logo {
                top: 20px;
                right: 20px;
                height: 40px;
            }
            .meta-block {
        position: absolute;
        left: 10px;
        bottom: 7px;           /* Pins block 7px from bottom of header */
        top: auto;             /* Cancel top positioning if present */
        font-size: 11px !important;
        line-height: 1.05;
        min-width: 0;
        max-width: 80vw;
        word-break: break-all;
    }
            .main-content {
                margin-top: 10px;
                margin-bottom: 14px;
                padding: 0 7px;
            }
            h1.question, h2.question {
                font-size: 1.2rem;
                margin-top: 0.3em;
                margin-bottom: 0.9em;
                padding-left: 0;
                padding-right: 0;
            }
            .answer-card {
                margin-bottom: 0.7rem;
                padding: 0.8rem 0.5rem;
                font-size: 0.89rem;
                border-radius: 8px;
            }
        }
    </style>
</head>
<body>
<div class="header">
    <button class="back-arrow-btn" onclick="window.history.length > 1 ? window.history.back() : window.location='https://faq.petitek.com';" title="Back">
        <svg viewBox="0 0 28 28" fill="none"><path d="M18 24L10 14L18 4" stroke="white" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <img src="/answers/petitek_logo.png" alt="Petitek Logo" class="header-logo">
    <div class="meta-block">
        <span class="meta-label">Timestamp:</span> 2025-07-21 02:43:11<br>
        <span class="meta-label">ID:</span> de01b0a6-90f5-441c-9c65-aa1df2aec07e
    </div>
</div>

<div class="main-content">
    <h1 class="question">Q: How many batteries are needed?</h1>
    <div class="answer-card">ChatrBox requires 4 AAA batteries for operation. You can also power it using a USB-C adapter if you prefer not to use batteries. 

🐾 Fur real, you're the best!</div>
</div>
</body>
</html>
